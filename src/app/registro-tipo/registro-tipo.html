<!-- Contenedor principal del formulario de registro -->
<div class="container mt-4 mb-5">

  <!-- Título e indicación de la pantalla -->
  <div class="text-center mb-4">
    <h2>Registrar tipo de sistema</h2>
    <p>Ingresa los datos del nuevo tipo de sistema.</p>
  </div>

  <!-- Tarjeta que contiene el formulario -->
  <div class="card shadow-sm">

    <!-- Encabezado de la tarjeta -->
    <div class="card-header">
      <h5 class="mb-0">Datos del sistema</h5>
    </div>

    <!-- Cuerpo de la tarjeta -->
    <div class="card-body">

      <!-- Al enviar el formulario se ejecuta el método insertarTipoSistema() -->
      <form (ngSubmit)="insertarTipoSistema()">

        <!-- Campo para ingresar el nombre del sistema -->
        <div class="form-group">
          <label>Nombre del sistema</label>
          <input
            type="text"
            class="form-control"
            name="nombre"
            [(ngModel)]="nombre"
            placeholder="Escribe el nombre"
            required>
        </div>

        <!-- Campo para ingresar la descripción -->
        <div class="form-group">
          <label>Descripción</label>
          <textarea
            class="form-control"
            name="descripcion"
            [(ngModel)]="descripcion"
            placeholder="Describe el sistema"
            required></textarea>
        </div>

        <!-- Lista para seleccionar la categoría del sistema -->
        <div class="form-group">
          <label>Categoría</label>
          <select
            class="form-control"
            name="categoria"
            [(ngModel)]="categoria"
            required>
            <option value="" disabled>Selecciona una categoría</option>
            <option value="Escritorio">Escritorio</option>
            <option value="Web">Web</option>
            <option value="Móvil">Móvil</option>
            <option value="Distribuido">Distribuido</option>
          </select>
        </div>

        <!-- Lista para seleccionar el estado del sistema -->
        <div class="form-group">
          <label>Estado</label>
          <select
            class="form-control"
            name="estado"
            [(ngModel)]="estado">
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
          </select>
        </div>

        <!-- Botón para registrar el sistema.
             Permanece deshabilitado si faltan datos obligatorios. -->
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="!nombre || !descripcion || !categoria">
          Registrar
        </button>

      </form>
    </div>
  </div>
</div>
