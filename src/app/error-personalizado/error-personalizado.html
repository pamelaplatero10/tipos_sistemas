<!-- Contenedor principal de la página de error -->
<div class="container mt-5">

  <!-- Mensajes que indican que la página no existe -->
  <div class="text-center">
    <h1>¡Ups! Página no encontrada</h1>
    <h2>404</h2>
    <p>La dirección que intentaste visitar no existe en nuestro sistema.</p>

    <!-- Enlace para regresar a la pantalla principal -->
    <a routerLink="/" class="btn btn-primary">Regresar al inicio</a>

    <!-- Imagen decorativa para la página de error -->
    <div class="mt-4">
      <img src="/imagenes/meme.jpeg" alt="Meme de error 404">
    </div>
  </div>
</div>
